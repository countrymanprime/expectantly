name: Release

# Pushing a version tag publishes that version, for example:
#   git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
# MinVer turns the tag into the package version. A tag with a pre-release
# suffix (anything after "-") creates a pre-release on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer reads the version from git tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack src/Expectantly/Expectantly.csproj --configuration Release --output artifacts

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes "${flags[@]}"
